<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070809">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Zuhause</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23070809'/><circle cx='16' cy='16' r='6' fill='%23ffc566'/></svg>">
  <!-- Inter (optional; ohne Internet greift die Systemschrift) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <section class="hero" id="hero" aria-label="Kameras">
      <div class="hero-media" id="hero-media"></div>
      <div class="hero-top">
        <span class="chip"><span class="live-dot"></span>Live</span>
        <div class="hero-actions">
          <span class="chip mono" id="cam-time"></span>
          <button class="icon-btn glass" id="cam-expand" type="button" aria-label="Kamera vergrößern"></button>
        </div>
      </div>
      <div class="hero-bottom">
        <div class="cam-title" id="cam-name"></div>
        <div class="cam-sub" id="cam-sub"></div>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </section>

    <aside class="side">
      <header class="clock-block">
        <div class="side-top">
          <span id="greeting"></span>
          <div class="side-actions">
            <button class="icon-btn" id="btn-ambient" type="button" aria-label="Ruhemodus" title="Ruhemodus"></button>
            <button class="icon-btn" id="btn-fs" type="button" aria-label="Vollbild" title="Vollbild"></button>
          </div>
        </div>
        <div class="clock" id="clock">--:--</div>
        <div class="meta">
          <span id="date"></span>
          <span class="weather" id="weather"></span>
        </div>
      </header>

      <section class="scenes-panel" aria-labelledby="h-scenes">
        <div class="group-h"><h2 id="h-scenes">Szenen</h2><span class="hint">auch per Alexa</span></div>
        <div class="scenes" id="scenes"></div>
      </section>

      <section class="panel agenda" aria-labelledby="h-agenda">
        <div class="group-h"><h2 id="h-agenda">Heute</h2><span class="hint" id="agenda-meta"></span></div>
        <ol class="events" id="agenda"></ol>
      </section>

      <section class="panel music" id="music" aria-label="Musik"></section>
    </aside>

    <section class="controls" aria-label="Steuerung">
      <div class="group">
        <div class="group-h"><h2>Licht</h2><span class="hint">Tippen · Ziehen zum Dimmen</span></div>
        <div class="tiles" id="lights"></div>
      </div>
      <div class="group">
        <div class="group-h"><h2>Rollläden</h2><span class="hint">Tippen · Ziehen zum Fahren</span></div>
        <div class="tiles" id="covers"></div>
      </div>
    </section>
  </div>

  <div class="ambient" id="ambient" aria-hidden="true">
    <div class="amb-inner" id="amb-inner">
      <div class="amb-clock" id="amb-clock"></div>
      <div class="amb-date" id="amb-date"></div>
      <div class="amb-next" id="amb-next"></div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
